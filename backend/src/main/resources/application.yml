server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: donationapp-backend
  main:
    web-application-type: servlet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donationapp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    locations: classpath:db/migration
  jpa:
    database-platform: ${SPRING_JPA_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:${MAIL_SMTP_AUTH:true}}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:${MAIL_SMTP_STARTTLS_ENABLE:true}}
          ssl:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:${MAIL_SMTP_SSL_ENABLE:false}}
            trust: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:${MAIL_SMTP_SSL_TRUST:*}}
          connectiontimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:${MAIL_SMTP_CONNECTIONTIMEOUT:10000}}
          timeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:${MAIL_SMTP_TIMEOUT:10000}}
          writetimeout: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:${MAIL_SMTP_WRITETIMEOUT:10000}}

donationapp:
  test-mode: ${DONATION_TEST_MODE:false}
  test-min-amount: ${DONATION_TEST_MIN_AMOUNT:10.00}
  verified-upi-id: ${VERIFIED_UPI_ID:}
  # Production frontend URL. Must be set via APP_BASE_URL env var in Render.
  app-base-url: ${APP_BASE_URL:https://donation-app-6xky.onrender.com}
  jwt:
    # JWT secret MUST be set via JWT_SECRET env var in Render Dashboard.
    # Generate with: openssl rand -hex 32
    # DO NOT commit real secrets to source control.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:donations@unicodeestates.in}
    admin-email: ${DONATION_ADMIN_EMAIL:${spring.mail.username:admin@donation.app}}

# Brevo Transactional Email API
# API key must be set via BREVO_API_KEY environment variable in Render Dashboard.
# Do NOT put the actual key here.
brevo:
  api-key: ${BREVO_API_KEY:}

# Razorpay Payment Gateway
# IMPORTANT: RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET MUST be set via environment
# variables in the Render Dashboard. Do NOT put real keys in source control.
# The fallback values here are intentionally empty — payment will show as
# unconfigured if env vars are not set, rather than using wrong credentials.
razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:}
    secret: ${RAZORPAY_KEY_SECRET:}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
